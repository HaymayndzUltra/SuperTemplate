# Project Type Classification Rules
project_types:
  - id: "generic_web_app"
    name: "Generic Web Application"
    description: "Standard web app without AI/ML"
    indicators:
      frontend_frameworks: ["react", "vue", "angular", "next.js", "nuxt"]
      backend_frameworks: ["express", "django", "flask", "fastapi", "rails"]
      excludes: ["tensorflow", "pytorch", "scikit-learn"]
    confidence_threshold: 0.85

  - id: "ai_ml_application"
    name: "AI/ML Application"
    description: "Primary focus on machine learning"
    indicators:
      ai_frameworks: ["tensorflow", "pytorch", "scikit-learn", "keras"]
      keywords: ["model training", "machine learning", "neural network", "deep learning"]
      requires: ["model_training"]
    confidence_threshold: 0.9

  - id: "hybrid_application"
    name: "Hybrid Application"
    description: "Mix of generic and AI/ML features"
    indicators:
      has_frontend: true
      has_ai_components: true
    confidence_threshold: 0.7

  - id: "data_pipeline"
    name: "Data Pipeline"
    description: "ETL, data processing, analytics"
    indicators:
      keywords: ["etl", "data pipeline", "data processing", "analytics"]
      tech_stack: ["airflow", "spark", "dask"]
    confidence_threshold: 0.8

  - id: "mobile_application"
    name: "Mobile Application"
    description: "iOS, Android, React Native"
    indicators:
      tech_stack: ["react native", "flutter", "swift", "kotlin", "ios", "android"]
    confidence_threshold: 0.9

  - id: "api_microservice"
    name: "API/Microservice"
    description: "Backend services, REST/GraphQL APIs"
    indicators:
      keywords: ["api", "microservice", "rest", "graphql"]
      no_frontend: true
    confidence_threshold: 0.9

  - id: "other"
    name: "Other"
    description: "Blockchain, IoT, Desktop, etc."
    indicators:
      keywords: ["blockchain", "iot", "desktop", "embedded"]
    confidence_threshold: 0.5

