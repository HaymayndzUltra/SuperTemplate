<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Mobile Preview Funnel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- State 1: The Hook (Static Preview) -->
        <div id="state1" class="state active">
            <header class="preview-header">
                <img src="Instagram_logo.svg.png" alt="Instagram Logo" class="logo-image">
                <a href="#" class="continue-link _ab16">Continue on web</a>
            </header>

            <main class="preview-content">
                <div class="video-thumbnail-container">
                    <img src="thumbnail3.png" alt="Video Thumbnail" class="video-thumbnail">
                    <button class="play-button" aria-label="Play video">
                        <!-- SVG Play Icon -->
                        <svg viewBox="0 0 24 24" fill="white" width="48px" height="48px"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                </div>
            </main>

            <footer class="preview-footer">
                <div class="footer-content">
                    <p class="watch-text">Watch this reel in the app</p>
                    <div class="cta-buttons">
                        <button class="open-app-button">Open Instagram</button>
                        <button class="signup-button">Sign up</button>
                    </div>
                    <p class="terms-policy-text">By continuing, you agree to Instagram's Terms of Use and Privacy Policy.</p>
                </div>
            </footer>
        </div>

        <!-- State 2: The Immersion (Immersive Player) -->
        <div id="state2" class="state">
            <video id="immersive-video" src="https://www.w3schools.com/tags/movie.mp4" playsinline muted loop preload="auto"></video>

            <div class="ui-overlay">
                <header class="overlay-header">
                    <a href="#" class="login-link">Log in</a>
                    <button class="open-app-button">Open app</button>
                </header>

                <div class="user-info-panel">
                    <img src="https://via.placeholder.com/40x40/555/fff?text=PP" alt="Profile Picture" class="user-profile-pic">
                    <span class="username">some_user_name</span>
                </div>

                <div class="interaction-icons">
                    <button class="icon-button"><img src="https://img.icons8.com/ios-filled/50/ffffff/like--v1.png" alt="Like"></button>
                    <button class="icon-button"><img src="https://img.icons8.com/ios-filled/50/ffffff/speech-bubble.png" alt="Comment"></button>
                    <button class="icon-button"><img src="https://img.icons8.com/ios-filled/50/ffffff/share--v1.png" alt="Share"></button>
                </div>
            </div>
        </div>

        <!-- State 3: The Gate (Call-to-Action) -->
        <div id="state3" class="state">
            <div class="dark-overlay"></div>
            <div class="cta-modal">
                <div class="circular-reveal-container">
                    <img src="" alt="Profile Picture" class="modal-profile-pic">
                </div>
                <h3 class="prompt-text">Sign in your Facebook or Instagram</h3>
                <button id="final-cta-button" class="action-button">Sign up for Instagram</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
